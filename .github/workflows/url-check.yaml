# Checks the URLs in the documentation, as CRAN does on submission. Run by hand from the Actions tab, and on pull requests
# into dev-2.0 and master.
on:
  workflow_dispatch:
  pull_request:
    branches: [dev-2.0, master]

name: URL-check

permissions: read-all

jobs:
  url-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::urlchecker, any::spelling
          needs: check
      - name: Check URLs
        run: |
          res <- urlchecker::url_check()
          print(res)
          if (NROW(res) > 0) stop(NROW(res), " URL problem(s) found")
        shell: Rscript {0}
      - name: Check spelling
        run: |
          res <- spelling::spell_check_package()
          print(res)
          if (NROW(res) > 0) stop(NROW(res), " possible spelling error(s); fix them or add the words to inst/WORDLIST")
        shell: Rscript {0}
